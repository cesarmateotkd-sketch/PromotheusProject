'use strict';
// Frog Ronin: a tiny frog samurai auto-duels bugs along a pond path. Every few stops you pick
// 1 of 3 techniques; pairs form named combos. Mantis mini-boss mid-run, Hornet Shogun at the end.
// Between runs, craft gear at the dojo from bug materials.

// ---- Built to be checked ----------------------------------------------------------------
const params = new URLSearchParams(location.search);
const tune = new Proxy({}, { get: (_, k) => CONFIG[k].value }); // live: tune.speed is CONFIG.speed.value
const STEP = 1 / 60;            // simulation step in seconds; motion is per second, never per frame
const W = 360, H = 640;         // logical size: phone portrait
const PIXEL = false;            // the canvas stays sharp for text; sprites are drawn as crisp pixel blocks
const P = 3;                    // one sprite pixel = 3 logical units
const FONT = '"Courier New", ui-monospace, monospace';
const TITLE = 'Frog Ronin';
const CONTROLS = ['Tap a card to pick a technique', 'Hold the screen to speed up', 'P: pause   M: mute']; // shown on the title screen
const clock = window.GAME_CLOCK || { now: () => performance.now() / 1000 }; // a check may inject one
const CHEAP = params.get('render') === 'cheap';
let seed;
function rng() { // mulberry32; every gameplay random call reads this, never Math.random
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), seed | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const events = []; // window.game.events: anything the game wants a run to see

// ---- Screen ---------------------------------------------------------------------------
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let viewScale = 1;
function fit() { // fills the window at any size and pixel ratio
  const k = Math.min(innerWidth / W, innerHeight / H);
  const s = PIXEL ? Math.max(1, Math.floor(k)) : k;
  const r = PIXEL ? 1 : s * (devicePixelRatio || 1);
  viewScale = s;
  canvas.width = Math.round(W * r); canvas.height = Math.round(H * r);
  canvas.style.width = Math.round(W * s) + 'px'; canvas.style.height = Math.round(H * s) + 'px';
  canvas.style.marginTop = Math.max(0, Math.floor((innerHeight - H * s) / 2)) + 'px';
  canvas.style.imageRendering = 'auto';
  ctx.setTransform(r, 0, 0, r, 0, 0); ctx.imageSmoothingEnabled = false;
}
addEventListener('resize', fit); fit();
function clear(c) { ctx.fillStyle = c; ctx.fillRect(0, 0, W, H); }
function text(s, x, y, size, c, align = 'center', bold = true) {
  ctx.fillStyle = c; ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align;
  ctx.textBaseline = 'middle'; ctx.fillText(s, x, y);
}
function shadowText(s, x, y, size, c, align = 'center') { text(s, x + 2, y + 2, size, '#0d0b16', align); text(s, x, y, size, c, align); }
function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.round(w), Math.round(h)); }
function panel(x, y, w, h, fill, border) { rect(x, y, w, h, border); rect(x + 3, y + 3, w - 6, h - 6, fill); }

// ---- Input: keys by position (event.code), taps and holds on the canvas -------------------
const down = new Set(), hit = new Set();
const pressed = code => hit.has(code); // true for one step after the key goes down
addEventListener('keydown', e => {
  startAudio();
  if (!e.repeat) { down.add(e.code); hit.add(e.code); }
  if (e.code === 'Space' || e.code.startsWith('Arrow')) e.preventDefault();
});
addEventListener('keyup', e => down.delete(e.code));
let taps = [], pointerHeld = false;
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
canvas.addEventListener('pointerdown', e => { startAudio(); taps.push(toLogical(e)); pointerHeld = true; e.preventDefault(); });
addEventListener('pointerup', () => { pointerHeld = false; });
addEventListener('pointercancel', () => { pointerHeld = false; });
addEventListener('blur', () => { down.clear(); pointerHeld = false; });
function tapIn(x, y, w, h) { return taps.some(t => t.x >= x && t.x <= x + w && t.y >= y && t.y <= y + h); }
const anyTap = () => taps.length > 0;

// ---- Audio: started on first input, mute on M --------------------------------------------
let audio = null, muted = false;
function startAudio() {
  if (!audio) {
    const ac = window.GAME_AUDIO || new (window.AudioContext || window.webkitAudioContext)(); // a check may inject one
    const out = ac.createGain(); out.gain.value = muted ? 0 : tune.volume;
    out.connect(ac.destination); audio = { ac, out };
  }
  if (audio.ac.state === 'suspended') audio.ac.resume();
}
function setMuted(m) { muted = m; if (audio) audio.out.gain.value = m ? 0 : tune.volume; }
addEventListener('tune', () => setMuted(muted));
function tone(freq, dur, type = 'square', vol = 0.15, delay = 0) {
  if (!audio || muted) return;
  const t = audio.ac.currentTime + delay, o = audio.ac.createOscillator(), g = audio.ac.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(audio.out); o.start(t); o.stop(t + dur);
}
const sfx = {
  hit: () => tone(180 + rng() * 40, 0.06, 'square', 0.08),
  crit: () => { tone(520, 0.08, 'square', 0.1); tone(780, 0.1, 'square', 0.08, 0.05); },
  hurt: () => tone(110, 0.12, 'sawtooth', 0.1),
  dodge: () => tone(900, 0.08, 'triangle', 0.1),
  coin: () => tone(1320, 0.05, 'square', 0.05),
  pick: () => { tone(440, 0.06); tone(660, 0.08, 'square', 0.12, 0.06); },
  combo: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.18, 'square', 0.12, i * 0.08)),
  lash: () => tone(300, 0.12, 'triangle', 0.12),

  boss: () => { tone(60, 0.5, 'sawtooth', 0.16); tone(45, 0.6, 'sawtooth', 0.12, 0.2); },

  I: '#ffe85a', i: '#c8a020',                                                 // firefly / gold

const SPR = {};
function sprite(name, rows) {
  const w = Math.max(...rows.map(r => r.length)), h = rows.length;
  const make = white => {
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const x = c.getContext('2d');
    rows.forEach((r, j) => { for (let i = 0; i < r.length; i++) { const ch = r[i]; if (ch === '.' || ch === ' ') continue; x.fillStyle = white ? '#ffffff' : PAL[ch]; x.fillRect(i, j, 1, 1); } });
    return c;
  };
  SPR[name] = { c: make(false), wc: make(true), w, h };
}
function drawSprite(name, x, y, o = {}) {
  const s = SPR[name], sc = o.scale || P;
  ctx.save(); ctx.imageSmoothingEnabled = false; ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
  const img = o.white ? s.wc : s.c;
  if (o.flip) { ctx.translate(Math.round(x + s.w * sc), Math.round(y)); ctx.scale(-1, 1); ctx.drawImage(img, 0, 0, s.w * sc, s.h * sc); }
  else ctx.drawImage(img, Math.round(x), Math.round(y), s.w * sc, s.h * sc);
  ctx.restore();
}
// draw standing on the ground: cx = centre, gy = feet
function drawFeet(name, cx, gy, o = {}) { const s = SPR[name], sc = o.scale || P; drawSprite(name, cx - s.w * sc / 2, gy - s.h * sc, o); }

// ---- Rendered sprites: strips in assets/ made by tools/sprites/frog-ronin (Blender + Python) ----
// Each strip is one animation, 12 fps; window.SPRITES (assets/sprites.js) holds the cell size, the
// ground row and origin column inside a cell, and the frame count. Until a strip has loaded (or if
// assets/ is missing) the game falls back to the hand-placed pixel grids above.
const SPRITES = window.SPRITES || {};
const SHEETS = {}, BG = {}, IMGS = window.SPRITE_IMAGES || {}; // embedded copies: no canvas taint from file://
for (const [ch, m] of Object.entries(SPRITES)) for (const an of Object.keys(m.anims)) {
  const im = new Image(); im.src = IMGS[`${ch}_${an}`] || `assets/${ch}_${an}.png`; SHEETS[`${ch}_${an}`] = im;
}
for (const k of ['sky', 'far', 'water', 'ground']) { const im = new Image(); im.src = IMGS[`bg_${k}`] || `assets/bg_${k}.png`; BG[k] = im; }
const ready = im => im && im.complete && im.naturalWidth > 0;
const CHAR = { beetle: 'beetle', mosq: 'mosquito', spit: 'spitter', mantis: 'mantis', hornet: 'hornet' };
function animLen(ch, an) { const m = SPRITES[ch]; return m && m.anims[an] ? m.anims[an] / m.fps : 0; }
function hasAnim(ch, an) { return ready(SHEETS[`${ch}_${an}`]); }
/** Draw frame t (seconds into the anim) of character ch at ground point (x, gy). */
function drawAnim(ch, an, t, x, gy, o = {}) {
  const m = SPRITES[ch], im = SHEETS[`${ch}_${an}`];
  if (!m || !ready(im)) return false;
  const n = m.anims[an], sc = o.scale || 1;
  let fr = Math.floor(t * m.fps); fr = o.loop ? ((fr % n) + n) % n : Math.max(0, Math.min(n - 1, fr));
  const [cw, ch_] = m.cell;
  ctx.save(); ctx.imageSmoothingEnabled = false; ctx.globalAlpha = o.alpha == null ? 1 : o.alpha;
  ctx.drawImage(im, fr * cw, 0, cw, ch_, Math.round(x - m.origin_col * sc), Math.round(gy - m.ground_row * sc), cw * sc, ch_ * sc);
  ctx.restore(); return true;
}
function charTop(e) { const ch = CHAR[e.kind]; return hasAnim(ch, 'idle') ? SPRITES[ch].height : SPR[KINDS[e.kind].spr].h * P; }

function drawHud() {
  const f = state.frog;
  rect(0, 0, W, 64, 'rgba(13,11,22,0.85)');
  text(`STOP ${Math.min(state.stop, tune.stops)}/${tune.stops}`, 12, 18, 16, '#efe39c', 'left');
  const tt = Math.floor(state.t); text(`${Math.floor(tt / 60)}:${String(tt % 60).padStart(2, '0')}`, 168, 18, 16, '#c8c0e0');
  drawSprite('coin', 214, 9, { scale: 3 }); text(String(state.loot.coins), 238, 18, 16, '#f2c42a', 'left');
  // pause and mute buttons
  panel(296, 4, 28, 28, '#2a2445', '#4a3f6e'); rect(305, 11, 4, 14, '#efe39c'); rect(312, 11, 4, 14, '#efe39c');
  panel(328, 4, 28, 28, '#2a2445', '#4a3f6e'); rect(334, 14, 5, 8, '#efe39c'); rect(339, 11, 4, 14, '#efe39c');
  if (muted) { rect(346, 12, 3, 12, '#e03a3a'); }
  // frog HP
  text('HP', 12, 46, 14, '#a8f080', 'left');
  rect(40, 38, 220, 16, '#14101e'); rect(42, 40, 216 * f.hp / f.max, 12, '#4cc85a');
  if (f.shield > 0) rect(42, 40, Math.min(216, 216 * f.shield / f.max), 4, '#7ae8f0');
  text(`${Math.ceil(f.hp)}/${f.max}`, 268, 46, 14, '#ffffff', 'left');
  // boss bar
  const boss = state.enemies.find(e => KINDS[e.kind].boss && !e.dead);
  if (boss) {
    rect(20, 74, 320, 36, 'rgba(13,11,22,0.8)');
    text(KINDS[boss.kind].name.toUpperCase(), 180, 84, 14, boss.kind === 'hornet' ? '#f2c42a' : '#ffbe78');
    rect(30, 94, 300, 10, '#14101e'); rect(31, 95, 298 * Math.max(0, boss.hp / boss.max), 8, '#e03a3a');
  }
  // technique tray
  rect(0, 470, W, 170, '#14101e');
  rect(0, 470, W, 3, '#3c3258');
  text('TECHNIQUES', 12, 488, 14, '#8a80aa', 'left');
  const ks = Object.keys(state.techs);
  if (!ks.length) text('first pick after 2 stops', 12, 512, 14, '#6a6090', 'left', false);
  ks.forEach((k, i) => {
    const x = 12 + (i % 4) * 86, y = 500 + Math.floor(i / 4) * 34;
    drawSprite(TECHS[k].icon, x, y, { scale: 3 });
    text(`Lv${state.techs[k]}`, x + 32, y + 13, 14, '#efe39c', 'left');
  });
  let cy = 574;
  if (state.combos.size) text('COMBOS', 12, cy, 14, '#8a80aa', 'left');
  [...state.combos].forEach((id, i) => { const c = COMBOS.find(c => c.id === id); text(c.name, 88 + (i % 2) * 140, cy + Math.floor(i / 2) * 20, 14, '#fff07a', 'left'); });
  text(state.speed > 1 ? `SPEED x${tune.speedup}` : 'hold screen: speed up', W / 2, 626, 14, state.speed > 1 ? '#f2c42a' : '#6a6090');
}
function drawFx(dt) {
  for (const fx of state.fx) {
    fx.t += dt;
    if (fx.type === 'spark') { const k = fx.t / 0.15; for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2 + 0.6; rect(fx.x + Math.cos(a) * k * 18, fx.y + Math.sin(a) * k * 18, 6, 6, '#ffffff'); } }
    if (fx.type === 'tongue') {
      const k = Math.min(1, fx.t / 0.08);
      for (const p of fx.targets) {
        const sx = FROG_X + 24, sy = GROUND - 30, ex = sx + (p.x - 30 - sx) * k, ey = sy + (p.y - 24 - sy) * k;
        ctx.strokeStyle = fx.storm ? '#6ab4ff' : '#ff8fb0'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
        rect(ex - 6, ey - 6, 12, 12, fx.storm ? '#c8e4ff' : '#ff8fb0');
      }
    }
    if (fx.type === 'ring') { const r = fx.t * 520; ctx.strokeStyle = fx.thunder ? 'rgba(255,232,90,0.8)' : 'rgba(255,232,90,0.5)'; ctx.lineWidth = 6; ctx.strokeRect(FROG_X - r, GROUND - 40 - r * 0.5, r * 2, r); }
    if (fx.type === 'coin') { fx.vy += 520 * dt; fx.x += fx.vx * dt; fx.y += fx.vy * dt; drawSprite('coin', fx.x, Math.min(fx.y, GROUND - 18), { scale: 3 }); }
  }
  state.fx = state.fx.filter(f => f.t < (f.type === 'coin' ? 0.8 : f.type === 'ring' ? 0.35 : 0.25));
  for (const fl of state.floaters) { fl.t += dt; shadowText(fl.s, fl.x, fl.y - fl.t * 50, fl.size, fl.c); }
  state.floaters = state.floaters.filter(f => f.t < 0.9);
  for (const s of state.shots) { const k = s.t / tune.spit_travel; drawSprite('goo', s.x + (FROG_X + 30 - s.x) * k, s.y - Math.sin(k * Math.PI) * 30 + (GROUND - 40 - s.y) * k, { scale: 3 }); }
}
function drawBanner(dt) {
  const b = state.banner; if (!b) return;
  b.t += dt;
  if (b.t > 2.2) { state.banner = null; return; }
  const a = Math.min(1, b.t / 0.15, (2.2 - b.t) / 0.3);
  ctx.save(); ctx.globalAlpha = a;
  rect(0, 160, W, 86, 'rgba(13,11,22,0.85)'); rect(0, 160, W, 3, b.color); rect(0, 243, W, 3, b.color);
  shadowText(b.text, W / 2, 192, b.text.length > 13 ? 26 : 32, b.color);
  text(b.sub, W / 2, 226, 14, '#e8e0ff', 'center', false);
  ctx.restore();
}
function cardRect(i) { return { x: 18, y: 168 + i * 128, w: 324, h: 116 }; }
function drawPick() {
  rect(0, 0, W, H, 'rgba(13,11,22,0.78)');
  shadowText('CHOOSE A TECHNIQUE', W / 2, 140, 20, '#efe39c');
  state.offer.forEach((k, i) => {
    const r = cardRect(i), T = TECHS[k], cur = lvl(k), cb = comboFor(k);
    panel(r.x, r.y, r.w, r.h, '#221d3a', cb && cb.ready ? '#f2c42a' : '#4a3f6e');
    drawSprite(T.icon, r.x + 14, r.y + 18, { scale: 5 });
    text(T.name, r.x + 74, r.y + 24, 18, '#ffffff', 'left');
    text(cur ? `Lv${cur} > Lv${cur + 1}` : 'NEW', r.x + r.w - 14, r.y + 24, 14, cur ? '#a8f080' : '#9cd6ff', 'right');
    text(T.desc(cur + 1), r.x + 74, r.y + 52, 14, '#d8d0f0', 'left', false);
    if (cb) {
      if (cb.ready) { rect(r.x + 10, r.y + 72, r.w - 20, 32, '#3a2f12'); text(`+ ${TECHS[cb.partner].name} = ${cb.c.name}`, r.x + 18, r.y + 88, 14, '#fff07a', 'left'); }
      else text(`combo: ${TECHS[cb.partner].name} > ${cb.c.name}`, r.x + 18, r.y + 88, 13, '#8a80aa', 'left', false);
    }
    text(String(i + 1), r.x + 30, r.y + r.h - 16, 12, '#6a6090');
  });
}

// ---- Scenes --------------------------------------------------------------------------------
let fxDt = 0;
const scenes = {
  figures: {
    update(dt) { state.t += dt; },
    draw() {
      drawWorld(0); rect(0, 0, W, H, 'rgba(13,11,22,0.45)');
      text('FIGURES', W / 2, 26, 18, '#efe39c');
      const row = (list, gy) => list.forEach(([n, label, x]) => {
        const ch = n === 'frog' ? 'frog' : CHAR[n];
        if (!drawAnim(ch, 'idle', state.t, x, gy, { loop: true })) drawFeet(n, x, gy);
        text(label, x, gy + 16, 14, '#ffffff');
      });
      row([['frog', 'Frog Ronin', 70], ['beetle', 'Beetle', 180], ['mosq', 'Mosquito', 290]], 180);
      row([['spit', 'Spitter Bug', 90], ['mantis', 'Mantis', 250]], 330);
      row([['hornet', 'Hornet Shogun', 180]], 606);
    },
  },
  title: {
    update() {
      if (pressed('Enter') || pressed('Space') || anyTap()) { if (meta.runs > 0) scene = 'camp'; else { reset(); scene = 'play'; } }
    },
    draw() {
      drawWorld(state ? state.t * 20 : 0);
      rect(0, 0, W, H, 'rgba(13,11,22,0.35)');
      shadowText('FROG', W / 2, 120, 52, '#a8f080'); shadowText('RONIN', W / 2, 174, 52, '#e03a3a');
      if (!drawAnim('frog', 'idle', clock.now(), W / 2 + 20, 420, { loop: true, scale: 2 })) drawFeet('frog', W / 2, 360, { scale: 6 });
      panel(30, 452, 300, 116, '#1b1730', '#4a3f6e');
      CONTROLS.forEach((c, i) => text(c, W / 2, 478 + i * 30, 14, '#d8d0f0', 'center', false));
      text(meta.runs ? `Runs ${meta.runs}   Wins ${meta.wins}` : 'Become the legend of the pond', W / 2, 590, 14, '#8a80aa');
      text('TAP TO BEGIN', W / 2, 620, 18, Math.floor(clock.now() * 2) % 2 ? '#fff07a' : '#efe39c');
    },
  },
  play: {
    update(dt) {
      if (pressed('KeyP') || pressed('Escape') || tapIn(296, 4, 28, 28)) { scene = 'pause'; return; }
      if (tapIn(328, 4, 28, 28)) { setMuted(!muted); taps = []; }
      if (state.phase === 'pick') {
        state.speed = 1;
        state.offer.forEach((k, i) => { const r = cardRect(i); if (pressed('Digit' + (i + 1)) || tapIn(r.x, r.y, r.w, r.h)) { if (state.offer) choose(k); } });
        state.t += dt; return;
      }
      if (state.phase === 'end') {
        state.endT += dt;
        if (state.endT > 1.2) scene = 'results';
        return;
      }
      state.speed = (pointerHeld || down.has('Space')) ? tune.speedup : 1;
      const sdt = dt * state.speed;
      state.t += sdt; fxDt += sdt;
      const f = state.frog;
      f.swing = Math.max(0, f.swing - sdt); f.flash = Math.max(0, f.flash - sdt); f.hop = Math.max(0, f.hop - sdt); f.actT += sdt;
      state.shake = Math.max(0, state.shake - sdt);
      for (const e of state.enemies) { e.actT += sdt; e.flash = Math.max(0, e.flash - sdt); e.lunge = Math.max(0, e.lunge - sdt); if (e.x > e.tx) e.x = Math.max(e.tx, e.x - 420 * sdt); }
      if (state.phase === 'walk') {
        state.phaseT += sdt; state.scroll += 90 * sdt;
        if (state.phaseT >= tune.walk_time) startStop();
      } else if (state.phase === 'fight') {
        if (state.enemies.every(e => e.x <= e.tx + 1)) fightStep(sdt);
      }
    },
    draw() {
      const sh = state.shake > 0 ? Math.round(Math.sin(state.t * 90) * 3) : 0;
      ctx.save(); ctx.translate(sh, 0);
      drawWorld(state.scroll);
      for (const e of [...state.enemies].sort((a, b) => (a.dy || 0) - (b.dy || 0))) drawEnemy(e);
      drawFrog(GROUND);
      const dt = fxDt; fxDt = 0;
      drawFx(dt);
      ctx.restore();
      drawHud();
      drawBanner(state.phase === 'pick' ? 0 : dt + (state.phase === 'end' ? 1 / 60 : 0));
      if (state.phase === 'pick') drawPick();
      if (state.phase === 'end') shadowText(state.gained, W / 2, 300, 28, state.outcome === 'win' ? '#fff07a' : '#ff8a8a');
    },
  },
  pause: {
    update() { if (pressed('KeyP') || pressed('Escape') || anyTap()) scene = 'play'; },
    draw() { scenes.play.draw(); rect(0, 0, W, H, 'rgba(13,11,22,0.6)'); shadowText('PAUSED', W / 2, H / 2 - 20, 36, '#efe39c'); text('tap or P to resume', W / 2, H / 2 + 24, 14, '#d8d0f0'); },
  },
  results: {
    update() { if (pressed('Enter') || pressed('Space') || anyTap()) scene = 'camp'; },
    draw() {
      drawWorld(state.scroll); rect(0, 0, W, H, 'rgba(13,11,22,0.7)'); rect(0, 440, W, H - 440, '#0d0b16');
      const win = state.outcome === 'win';
      shadowText(win ? 'POND LEGEND!' : 'THE FROG FALLS', W / 2, 110, 30, win ? '#fff07a' : '#ff8a8a');
      text(win ? 'The Hornet Shogun is defeated.' : `Reached stop ${state.stop} of ${tune.stops}`, W / 2, 150, 14, '#d8d0f0', 'center', false);
      const tt = Math.floor(state.t); text(`Time ${Math.floor(tt / 60)}:${String(tt % 60).padStart(2, '0')}`, W / 2, 174, 14, '#8a80aa');
      panel(30, 200, 300, 230, '#1b1730', '#4a3f6e');
      text('BROUGHT HOME', W / 2, 224, 16, '#efe39c');
      drawSprite('coin', 70, 246, { scale: 4 }); text(`${state.loot.coins} coins`, 104, 258, 16, '#f2c42a', 'left');
      MATS.forEach((m, i) => { const y = 290 + i * 26; drawSprite(m.icon, 70, y, { scale: 3 }); text(`${m.name} x${state.loot[m.id]}`, 104, y + 12, 14, '#ffffff', 'left'); });
      if (state.combos.size) text(`Combos: ${[...state.combos].map(id => COMBOS.find(c => c.id === id).name).join(', ')}`, W / 2, 460, 12, '#fff07a', 'center', false);
      text(win ? 'Craft stronger gear and run again' : 'Kept everything. Craft gear at the dojo!', W / 2, 500, 14, '#a8f080');
      text('TAP TO CONTINUE', W / 2, 580, 18, '#efe39c');
    },
  },
  camp: {
    update() {
      GEAR.forEach((g, i) => {
        const r = { x: 18, y: 168 + i * 112, w: 324, h: 100 };
        if (pressed('Digit' + (i + 1)) || tapIn(r.x, r.y, r.w, r.h)) craft(g);
      });
      if (pressed('Enter') || pressed('Space') || tapIn(60, 520, 240, 56)) { reset(); scene = 'play'; }
    },
    draw() {
      drawWorld(0); rect(0, 0, W, H, 'rgba(13,11,22,0.78)');
      shadowText('DOJO', W / 2, 36, 28, '#efe39c');
      text('craft gear from bug materials', W / 2, 66, 14, '#8a80aa', 'center', false);
      drawSprite('coin', 20, 90, { scale: 3 }); text(String(meta.coins), 44, 99, 16, '#f2c42a', 'left');
      MATS.forEach((m, i) => { const x = 20 + i * 66, y = 120; drawSprite(m.icon, x, y, { scale: 3 }); text(String(meta.mats[m.id]), x + 28, y + 12, 14, '#ffffff', 'left'); });
      GEAR.forEach((g, i) => {
        const r = { x: 18, y: 168 + i * 112, w: 324, h: 100 }, l = meta.gear[g.id], maxed = l >= GEAR_MAX;
        const cost = gearCost(g, l), ok = !maxed && canPay(cost);
        panel(r.x, r.y, r.w, r.h, '#221d3a', ok ? '#f2c42a' : '#4a3f6e');
        text(g.name, r.x + 14, r.y + 22, 16, '#ffffff', 'left');
        for (let k = 0; k < GEAR_MAX; k++) rect(r.x + r.w - 60 + k * 16, r.y + 14, 12, 12, k < l ? '#a8f080' : '#3c3258');
        text(l ? g.desc(l) + ' now' : 'not crafted yet', r.x + 14, r.y + 46, 14, l ? '#a8f080' : '#8a80aa', 'left', false);
        if (maxed) text('MASTERED', r.x + 14, r.y + 76, 14, '#fff07a', 'left');
        else text(`Craft: ${Object.entries(cost).map(([k, v]) => `${v} ${k}`).join(', ')}`, r.x + 14, r.y + 76, 13, ok ? '#fff07a' : '#ff8a8a', 'left', false);
        text(String(i + 1), r.x + r.w - 14, r.y + r.h - 14, 12, '#6a6090', 'right');
      });
      panel(60, 520, 240, 56, '#2f5a3a', '#a8f080');
      text('START RUN', W / 2, 548, 20, '#ffffff');
      text(`Runs ${meta.runs}   Wins ${meta.wins}   Best stop ${meta.best}`, W / 2, 604, 13, '#8a80aa', 'center', false);
    },
  },
};
function canPay(cost) { return Object.entries(cost).every(([k, v]) => (k === 'coins' ? meta.coins : meta.mats[k]) >= v); }
function craft(g) {
  const l = meta.gear[g.id]; if (l >= GEAR_MAX) return;
  const cost = gearCost(g, l); if (!canPay(cost)) return;
  for (const [k, v] of Object.entries(cost)) { if (k === 'coins') meta.coins -= v; else meta.mats[k] -= v; }
  meta.gear[g.id]++; saveMeta(); sfx.craft();
  events.push({ type: 'craft', gear: g.id, level: meta.gear[g.id] });
}

// ---- Loop: fixed step, frame time clamped ---------------------------------------------
function step() {
  if (pressed('KeyM')) { setMuted(!muted); hit.delete('KeyM'); }
  scenes[scene].update(STEP); hit.clear(); taps = [];
}
let last, acc = 0, ALPHA = 1; // ALPHA: how far the frame is between the last two steps
function tick() {
  const now = clock.now();
  acc += Math.min(now - last, 0.25); last = now; // a stall never fast-forwards the game
  while (acc >= STEP) { step(); acc -= STEP; }
  ALPHA = acc / STEP;
  drawFrame();
}
function drawFrame() { rect(0, 0, W, H, '#0d0b16'); scenes[scene].draw(); } // clear first: no scene shows the last one through
function frame() { tick(); requestAnimationFrame(frame); }
function timer() { if (document.visibilityState === 'visible' && clock.now() - last > 0.1) tick(); }

// ---- What a check can read and drive (?manual=1 stops the loop; players never see it) ----
window.game = {
  get scene() { return scene; },
  get state() { return state; },
  press(code) { hit.add(code); },
  hold(code, on) { on ? down.add(code) : down.delete(code); },
  get events() { return events; },
  step(n = 1, draw = true, alpha = 1) {
    for (let i = 0; i < n; i++) step();
    if (draw) { ALPHA = alpha; drawFrame(); }
  },
};

reset();
scene = params.get('scene') || 'title';
last = clock.now();
if (params.get('manual') === '1') drawFrame();
else { requestAnimationFrame(frame); setInterval(timer, 50); }
</script>
